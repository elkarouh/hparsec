[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zsh-linter"
version = "0.1.0"
description = "Lint zsh scripts: a zsh grammar with lint rules, built on hparsec"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["hparsec"]

[project.scripts]
zsh-lint = "zsh_linter:main"

[tool.setuptools]
py-modules = ["zsh_linter", "zsh_tokenizer", "style_rules"]
