[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hparsec"
version = "0.1.0"
description = "Operator-based parser combinator library with packrat memoization and left-recursion support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["hparsec", "ady_tokenizer", "hek_helpers"]
